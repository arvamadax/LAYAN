# Lint + build web dan tes API di tiap PR dan push ke main / dev/**.
name: CI
on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: [main, "dev/**"]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          API_URL: http://127.0.0.1:8170
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: cargo-${{ hashFiles('api/Cargo.lock') }}
      - run: cargo test
